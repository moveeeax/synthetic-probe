name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26", "1.27"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build -ldflags "-X main.version=${GITHUB_REF_NAME}" -o synthetic-probe .

      - name: Smoke test the binary
        run: |
          ./synthetic-probe --version
          ./synthetic-probe --config examples/targets.yaml --listen 127.0.0.1:9115 &
          PID=$!
          sleep 3
          curl -sf http://127.0.0.1:9115/metrics | grep -q "synthetic_probe_up"
          curl -sf http://127.0.0.1:9115/healthz | grep -q "ok"
          kill $PID

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image (no push)
        run: docker build -t synthetic-probe:ci .

      - name: Smoke test the image
        run: docker run --rm synthetic-probe:ci --version
